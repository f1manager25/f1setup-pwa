<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0a0f;color:#e8e8e8;font-family:'Rajdhani','Barlow Condensed',sans-serif;overscroll-behavior:none;}
:root{--red:#e10600;--card:#111118;--border:rgba(255,255,255,0.08);--dim:rgba(255,255,255,0.38);--dimmer:rgba(255,255,255,0.2);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--red);cursor:pointer;box-shadow:0 0 10px rgba(225,6,0,0.5);border:2px solid rgba(255,255,255,0.2);}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--red);border:2px solid rgba(255,255,255,0.2);}
input[type=number],input[type=text]{-webkit-appearance:none;appearance:none;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
textarea{-webkit-appearance:none;}
::-webkit-scrollbar{display:none;}
button{font-family:'Rajdhani',sans-serif;cursor:pointer;}
.num-input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 6px;color:white;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;text-align:center;outline:none;width:80px;transition:border-color 0.15s;}
.num-input:focus{border-color:var(--red);background:rgba(225,6,0,0.08);}
.time-input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:6px 4px;color:white;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;text-align:center;outline:none;width:70px;transition:border-color 0.15s;}
.time-input:focus{border-color:var(--red);}
.time-ms{width:82px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);color:white;padding:10px 22px;border-radius:6px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;background:#1a7a1a;}
.toast.show{opacity:1;}
.toast.err{background:#8b0000;}
.toast.inf{background:#1a4a8a;}
.ver-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;position:relative;}
.ver-card.act{border-color:var(--red);background:rgba(225,6,0,0.05);}
.ver-badge{position:absolute;top:10px;right:10px;background:var(--red);color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<script>
const CLIENT_ID="110820130550-gtslt9i3vr4rthtios0evgkcjrdng7a0.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.appdata";
const FNAME="f1manager_setups.json";

const TRACKS=[
  {name:"Austrália",flag:"🇦🇺"},{name:"China",flag:"🇨🇳"},{name:"Japão",flag:"🇯🇵"},
  {name:"Bahrain",flag:"🇧🇭"},{name:"Arábia Saudita",flag:"🇸🇦"},{name:"Miami",flag:"🇺🇸"},
  {name:"Emília-Romagna",flag:"🇮🇹"},{name:"Mônaco",flag:"🇲🇨"},{name:"Espanha",flag:"🇪🇸"},
  {name:"Canadá",flag:"🇨🇦"},{name:"Áustria",flag:"🇦🇹"},{name:"Grã-Bretanha",flag:"🇬🇧"},
  {name:"Hungria",flag:"🇭🇺"},{name:"Bélgica",flag:"🇧🇪"},{name:"Holanda",flag:"🇳🇱"},
  {name:"Itália",flag:"🇮🇹"},{name:"Azerbaijão",flag:"🇦🇿"},{name:"Singapura",flag:"🇸🇬"},
  {name:"Estados Unidos",flag:"🇺🇸"},{name:"México",flag:"🇲🇽"},{name:"Brasil",flag:"🇧🇷"},
  {name:"Las Vegas",flag:"🇺🇸"},{name:"Qatar",flag:"🇶🇦"},{name:"Abu Dhabi",flag:"🇦🇪"},

const MODES=[
  {id:"qualy_seco",label:"Qualy Seco",icon:"🏎️",color:"#f0c000"},
  {id:"qualy_chuva",label:"Qualy Chuva",icon:"🌧️",color:"#4fc3f7"},
  {id:"corrida_seco",label:"Corrida Seco",icon:"☀️",color:"#ff7043"},
  {id:"corrida_chuva",label:"Corrida Chuva",icon:"🌩️",color:"#90caf9"},
];
const FIELDS=[
  {sec:"aero",icon:"💨",label:"Aerodinâmica",fields:[
    {key:"asa_d",label:"Asa Dianteira",min:0,max:50,step:1,dec:0,unit:"",hint:"0 – 50"},
    {key:"asa_t",label:"Asa Traseira",min:0,max:50,step:1,dec:0,unit:"",hint:"0 – 50"},
  ]},
  {sec:"trans",icon:"⚙️",label:"Transmissão",fields:[
    {key:"diff_acel",label:"Diferencial Acel. Ativa",min:10,max:100,step:1,dec:0,unit:"%",hint:"10 – 100%"},
    {key:"diff_in",label:"Diferencial Acel. Inativa",min:10,max:100,step:1,dec:0,unit:"%",hint:"10 – 100%"},
  ]},
  {sec:"geo",icon:"📐",label:"Geometria",info:"Valores mínimos de cambagem/toe são geralmente os mais rápidos no F1 25.",fields:[
    {key:"camber_d",label:"Cambagem Dianteira",min:-3.50,max:-2.50,step:0.01,dec:2,unit:"°",hint:"-3.50° → -2.50°"},
    {key:"camber_t",label:"Cambagem Traseira",min:-2.00,max:-1.00,step:0.01,dec:2,unit:"°",hint:"-2.00° → -1.00°"},
    {key:"toe_d",label:"Toe-out Dianteiro",min:0.00,max:0.20,step:0.01,dec:2,unit:"°",hint:"0.00° → 0.20°"},
    {key:"toe_t",label:"Toe-in Traseiro",min:0.10,max:0.25,step:0.01,dec:2,unit:"°",hint:"0.10° → 0.25°"},
  ]},
  {sec:"susp",icon:"🔧",label:"Suspensão",fields:[
    {key:"susp_d",label:"Suspensão Dianteira",min:1,max:41,step:1,dec:0,unit:"",hint:"1 – 41"},
    {key:"susp_t",label:"Suspensão Traseira",min:1,max:41,step:1,dec:0,unit:"",hint:"1 – 41"},
    {key:"arb_d",label:"Barra Estab. Dianteira",min:1,max:21,step:1,dec:0,unit:"",hint:"1 – 21"},
    {key:"arb_t",label:"Barra Estab. Traseira",min:1,max:21,step:1,dec:0,unit:"",hint:"1 – 21"},
    {key:"alt_d",label:"Altura Frontal",min:15,max:35,step:1,dec:0,unit:"",hint:"15 – 35"},
    {key:"alt_t",label:"Altura Traseira",min:40,max:60,step:1,dec:0,unit:"",hint:"40 – 60"},
  ]},
  {sec:"freios",icon:"🛑",label:"Freios",fields:[
    {key:"bias",label:"Balanceamento Dianteiro",min:50,max:70,step:1,dec:0,unit:"%",hint:"50% – 70%"},
    {key:"pfreio",label:"Pressão dos Freios",min:80,max:100,step:1,dec:0,unit:"%",hint:"80% – 100%"},
  ]},
  {sec:"pneus",icon:"🏎️",label:"Pneus",fields:[
    {key:"pdd",label:"Pneu Diant. Direito",min:22.5,max:29.5,step:0.1,dec:1,unit:" psi",hint:"22.5 – 29.5"},
    {key:"pde",label:"Pneu Diant. Esquerdo",min:22.5,max:29.5,step:0.1,dec:1,unit:" psi",hint:"22.5 – 29.5"},
    {key:"ptd",label:"Pneu Tras. Direito",min:20.5,max:26.5,step:0.1,dec:1,unit:" psi",hint:"20.5 – 26.5"},
    {key:"pte",label:"Pneu Tras. Esquerdo",min:20.5,max:26.5,step:0.1,dec:1,unit:" psi",hint:"20.5 – 26.5"},
  ]},
];
const TABS=[...FIELDS.map(s=>({icon:s.icon,label:s.label})),{icon:"⏱️",label:"Tempo"},{icon:"📝",label:"Notas"}];
const DEF={asa_d:15,asa_t:10,diff_acel:50,diff_in:55,camber_d:-3.50,camber_t:-2.00,toe_d:0.00,toe_t:0.10,susp_d:25,susp_t:19,arb_d:15,arb_t:9,alt_d:25,alt_t:50,bias:58,pfreio:97,pdd:24.2,pde:24.2,ptd:21.3,pte:21.3,tmin:1,tseg:30,tms:0,notas:""};

// ── Storage local ──
const LKEY="f1mgr_v4";
let DB={};
function lDB(){try{DB=JSON.parse(localStorage.getItem(LKEY)||"{}")}catch{DB={}}}
function sDB(){localStorage.setItem(LKEY,JSON.stringify(DB))}
lDB();

const fv=(v,d)=>d>0?Number(v).toFixed(d):String(v);
const ft=(m,s,ms)=>`${m}:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
const fd=ts=>{const d=new Date(ts);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};

// ── Google Drive ──
const GD={
  tok:null,fid:null,user:null,st:"off",gsiReady:false,
  async init(){
    // Carregar Google GSI se ainda não carregou
    await this.loadGSI();
    const s=localStorage.getItem("f1gd");
    if(!s){this.st="off";render();return;}
    try{
      const t=JSON.parse(s);
      if(t.exp>Date.now()){
        this.tok=t.tok;this.user=t.user;this.avatar=t.avatar||null;this.st="sync";render();
        await this.findFile();await this.pull();this.st="on";
        ss({screen:"list"});
      } else {
        localStorage.removeItem("f1gd");this.st="off";render();
      }
    }catch(e){this.st="off";render();}
  },
  loadGSI(){
    return new Promise(resolve=>{
      if(window.google?.accounts?.oauth2){this.gsiReady=true;resolve();return;}
      // Script já está no head — aguardar carregamento
      const check=setInterval(()=>{
        if(window.google?.accounts?.oauth2){
          clearInterval(check);this.gsiReady=true;resolve();
        }
      },100);
      // Timeout de 5s
      setTimeout(()=>{clearInterval(check);resolve();},5000);
    });
  },
  login(){
    if(!this.gsiReady||!window.google?.accounts?.oauth2){
      toast("⚠️ Aguarde o Google carregar...","inf");
      this.loadGSI().then(()=>{if(this.gsiReady)this.login();});
      return;
    }
    const c=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:SCOPE+" https://www.googleapis.com/auth/userinfo.profile",
      callback:async r=>{
        if(r.error){toast("Erro Google: "+r.error,"err");return;}
        this.tok=r.access_token;this.st="sync";updBar();
        try{
          const u=await(await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+this.tok}})).json();
          this.user=u.name||u.email||"Google";
          this.avatar=u.picture||null;
        }catch{this.user="Google";this.avatar=null;}
        localStorage.setItem("f1gd",JSON.stringify({tok:this.tok,user:this.user,avatar:this.avatar,exp:Date.now()+3500000}));
        await this.findFile();await this.pull();this.st="on";
        toast("✓ Drive conectado! Backup ativo.");
        ss({screen:"list"});
      }
    });
    c.requestAccessToken();
  },
  logout(){
    this.tok=null;this.fid=null;this.user=null;this.st="off";
    localStorage.removeItem("f1gd");toast("Drive desconectado");render();
  },
  async findFile(){
    if(!this.tok)return;
    try{
      const r=await(await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FNAME}'&fields=files(id)`,{headers:{Authorization:"Bearer "+this.tok}})).json();
      if(r.files?.length){this.fid=r.files[0].id;}
      else{
        const f=await(await fetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{Authorization:"Bearer "+this.tok,"Content-Type":"application/json"},body:JSON.stringify({name:FNAME,parents:["appDataFolder"]})})).json();
        this.fid=f.id;
      }
    }catch(e){this.st="err";updBar();}
  },
  async pull(){
    if(!this.tok||!this.fid)return;
    try{
      const r=await fetch(`https://www.googleapis.com/drive/v3/files/${this.fid}?alt=media`,{headers:{Authorization:"Bearer "+this.tok}});
      if(r.status===200){
        const txt=await r.text();
        if(txt.trim().startsWith("{")){
          const drv=JSON.parse(txt);
          for(const t of Object.keys(drv)){
            if(!DB[t]){DB[t]=drv[t];}
            else for(const m of Object.keys(drv[t])){
              const dv2=drv[t][m]?.versions?.length||0,lv=DB[t][m]?.versions?.length||0;
              if(dv2>=lv)DB[t][m]=drv[t][m];
            }
          }
          sDB();
        }
      }
    }catch(e){}
  },
  async push(){
    if(!this.tok||!this.fid)return;
    this.st="sync";updBar();
    try{
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this.fid}?uploadType=media`,{method:"PATCH",headers:{Authorization:"Bearer "+this.tok,"Content-Type":"application/json"},body:JSON.stringify(DB)});
      this.st="on";
    }catch{this.st="err";toast("Erro ao salvar no Drive","err");}
    updBar();
  }
};

// ── DB helpers ──
function gVers(t,m){return DB[t]?.[m]?.versions||[];}
function gAct(t,m){const e=DB[t]?.[m];if(!e?.versions?.length)return null;return e.versions[e.activeIdx??0];}
function saveVer(t,m,form,stars,note){
  if(!DB[t])DB[t]={};
  if(!DB[t][m])DB[t][m]={versions:[],activeIdx:0};
  const vs=DB[t][m].versions;
  if(vs.length>=5)vs.shift();
  vs.push({setup:{...form},stars,note,ts:Date.now()});
  DB[t][m].activeIdx=vs.length-1;
  sDB();if(GD.tok)GD.push();
}
function delVer(t,m,i){
  if(!DB[t]?.[m])return;
  DB[t][m].versions.splice(i,1);
  if(DB[t][m].activeIdx>=DB[t][m].versions.length)DB[t][m].activeIdx=Math.max(0,DB[t][m].versions.length-1);
  sDB();if(GD.tok)GD.push();
}

// ── State ──
let S={screen:"login",track:null,mode:"qualy_seco",tab:0,form:{...DEF},search:""};
function ss(p){Object.assign(S,p);render();}

function toast(msg,t="ok"){const e=document.getElementById("toast");e.textContent=msg;e.className="toast show"+(t==="err"?" err":t==="inf"?" inf":"");setTimeout(()=>e.classList.remove("show"),2500);}
function render(){
  const a=document.getElementById("app");a.innerHTML="";
  if(S.screen==="login")      a.appendChild(rLogin());
  else if(S.screen==="list")  a.appendChild(rList());
  else if(S.screen==="setup") a.appendChild(rSetup());
  else                        a.appendChild(rVersions());
}

// ── TELA LOGIN ──
function rLogin(){
  const w=dv({minHeight:"100vh",background:"#0a0a0f",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"30px 24px"});

  // Logo F1 Manager
  const logo=dv({textAlign:"center",marginBottom:"48px"});
  const badge=el("div",{display:"inline-block",background:"var(--red)",fontWeight:700,fontSize:"22px",padding:"5px 16px",clipPath:"polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%)",letterSpacing:"2px",color:"white",fontFamily:"'Rajdhani',sans-serif",marginBottom:"12px"},"F1");
  const title=el("div",{fontWeight:700,fontSize:"28px",letterSpacing:"4px",textTransform:"uppercase",color:"white",fontFamily:"'Rajdhani',sans-serif",marginBottom:"6px"});
  title.innerHTML="MANAGER <span style='color:var(--red)'>SETUP</span>";
  const sub=el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"13px",letterSpacing:"3px",color:"rgba(255,255,255,0.3)",textTransform:"uppercase"},"F1 25 — Gerencie seus setups");
  logo.append(badge,title,sub);
  w.appendChild(logo);

  // Card de login
  const card=dv({width:"100%",maxWidth:"340px",background:"#111118",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"16px",padding:"32px 24px",textAlign:"center"});

  // Ícone Drive
  const driveIcon=el("div",{fontSize:"48px",marginBottom:"16px"},"☁️");
  card.appendChild(driveIcon);

  card.appendChild(el("div",{fontWeight:700,fontSize:"20px",letterSpacing:"2px",textTransform:"uppercase",color:"white",fontFamily:"'Rajdhani',sans-serif",marginBottom:"8px"},"Backup Google Drive"));
  card.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"14px",color:"rgba(255,255,255,0.45)",lineHeight:"1.5",marginBottom:"28px"},"Seus setups salvos automaticamente na nuvem. Acesse de qualquer dispositivo."));

  // Botão Google oficial
  const gBtn=document.createElement("button");
  gBtn.style.cssText="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:8px;border:none;background:white;cursor:pointer;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.4);";
  gBtn.innerHTML=`<svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.33 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.67 14.62 48 24 48z"/></svg>
  <span style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:1px;color:#333;">Entrar com Google</span>`;
  gBtn.addEventListener("click",()=>{
    gBtn.style.opacity="0.7";
    GD.login();
  });
  card.appendChild(gBtn);

  // Separador
  const sep=dv({display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"});
  sep.appendChild(dv({flex:1,height:"1px",background:"rgba(255,255,255,0.08)"}));
  sep.appendChild(el("span",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",color:"rgba(255,255,255,0.3)",letterSpacing:"1px"},"OU"));
  sep.appendChild(dv({flex:1,height:"1px",background:"rgba(255,255,255,0.08)"}));
  card.appendChild(sep);

  // Botão continuar sem login
  const skipBtn=bt("Continuar sem backup",{
    width:"100%",padding:"12px",borderRadius:"8px",
    background:"rgba(255,255,255,0.04)",color:"rgba(255,255,255,0.45)",
    border:"1px solid rgba(255,255,255,0.08)",
    fontFamily:"'Barlow Condensed',sans-serif",fontSize:"14px",
    fontWeight:600,letterSpacing:"1px"
  },()=>ss({screen:"list"}));
  card.appendChild(skipBtn);

  // Aviso
  card.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",color:"rgba(255,255,255,0.2)",marginTop:"20px",lineHeight:"1.4"},"Sem backup, dados ficam apenas neste dispositivo e podem ser perdidos ao limpar o cache."));

  w.appendChild(card);

  // Versão
  w.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",color:"rgba(255,255,255,0.15)",letterSpacing:"2px",marginTop:"32px"},"F1 MANAGER SETUP v3.0"));
  return w;
}

// ── Drive Bar (compacta — só aparece na tela de lista) ──
function mkBar(){
  const b=dv({
    display:"flex",alignItems:"center",gap:"8px",
    padding:"7px 14px",
    marginTop:"10px",
    background: GD.st==="on"  ? "rgba(76,175,80,0.10)"  :
                GD.st==="sync"? "rgba(240,192,0,0.10)"   :
                GD.st==="err" ? "rgba(225,6,0,0.10)"     :
                                "rgba(66,133,244,0.08)",
    border: GD.st==="on"  ? "1px solid rgba(76,175,80,0.3)"  :
            GD.st==="sync"? "1px solid rgba(240,192,0,0.3)"  :
            GD.st==="err" ? "1px solid rgba(225,6,0,0.3)"    :
                            "1px solid rgba(66,133,244,0.25)",
    borderRadius:"8px",
    minHeight:"36px"
  });
  b.id="drive-bar";

  // Ícone Drive
  const icon=el("div",{fontSize:"15px",flexShrink:0},
    GD.st==="on"?"☁️":GD.st==="sync"?"🔄":GD.st==="err"?"⚠️":"💾");

function rNotes(){
  const w=dv({});
  w.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",letterSpacing:"2px",color:"var(--dim)",textTransform:"uppercase",marginBottom:"8px"},"Notas e Estratégia"));
  const ta=document.createElement("textarea");
  ta.placeholder="Ex: Asa baixa para reta principal.\nFrear no 80m na curva 5.\nPneus esquentam após volta 8.";
  ta.value=S.form.notas;
  Object.assign(ta.style,{background:"rgba(255,255,255,0.04)",border:"1px solid var(--border)",borderRadius:"8px",padding:"12px",color:"white",fontFamily:"'Barlow Condensed',sans-serif",fontSize:"15px",width:"100%",minHeight:"130px",resize:"vertical",outline:"none",lineHeight:1.5});
  ta.addEventListener("input",e=>{S.form.notas=e.target.value;});w.appendChild(ta);
  const box=dv({background:"var(--card)",border:"1px solid var(--border)",borderRadius:"8px",padding:"14px",marginTop:"14px"});
  box.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",letterSpacing:"2px",color:"rgba(255,255,255,0.28)",textTransform:"uppercase",marginBottom:"10px"},"Resumo Completo"+(GD.st==="on"?" ☁️":"")));
  const f=S.form;
  [["💨 Asas",`${f.asa_d}/${f.asa_t}`],["⚙️ Diff",`${f.diff_acel}%/${f.diff_in}%`],["📐 Cambagem",`${fv(f.camber_d,2)}°/${fv(f.camber_t,2)}°`],["📐 Toe",`D${fv(f.toe_d,2)}°·T${fv(f.toe_t,2)}°`],["🔧 Suspensão",`${f.susp_d}/${f.susp_t}`],["🔧 Barra",`${f.arb_d}/${f.arb_t}`],["📏 Altura",`${f.alt_d}/${f.alt_t}`],["🛑 Freios",`${f.bias}%·${f.pfreio}%`],["🏎️ Pneus D",`${fv(f.pdd,1)}/${fv(f.pde,1)} psi`],["🏎️ Pneus T",`${fv(f.ptd,1)}/${fv(f.pte,1)} psi`],["⏱️ Volta",ft(f.tmin,f.tseg,f.tms)]].forEach(([l,v])=>{
    const r=dv({display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"});
    r.append(el("span",{fontSize:"12px",color:"var(--dim)",fontFamily:"'Barlow Condensed',sans-serif"},l),el("span",{fontSize:"13px",fontWeight:600,fontFamily:"'Rajdhani',sans-serif",color:"white"},v));
    box.appendChild(r);
  });
  w.appendChild(box);return w;
}

// ── VERSIONS ──
function rVersions(){
  const cm=MODES.find(m=>m.id===S.mode),vers=gVers(S.track.name,S.mode),ai=DB[S.track.name]?.[S.mode]?.activeIdx??0;
  const w=dv({minHeight:"100vh",background:"#0a0a0f"});
  const hdr=dv({background:"linear-gradient(135deg,#0f0f18,#18080a)",borderBottom:"2px solid var(--red)",padding:"12px 14px",position:"sticky",top:0,zIndex:100});
  const hr=dv({display:"flex",alignItems:"center",gap:"10px"});
  hr.appendChild(bt("←",{background:"none",border:"1px solid rgba(255,255,255,0.12)",color:"white",width:"34px",height:"34px",borderRadius:"4px",fontSize:"18px"},()=>ss({screen:"setup"})));
  const ht=dv({flex:1});
  ht.appendChild(el("div",{fontSize:"9px",color:"var(--dim)",letterSpacing:"2px",textTransform:"uppercase",fontFamily:"'Barlow Condensed',sans-serif"},S.track.flag+" "+S.track.name));
  ht.appendChild(el("div",{fontWeight:700,fontSize:"17px",letterSpacing:"1px",textTransform:"uppercase",color:"white",fontFamily:"'Rajdhani',sans-serif"},cm.icon+" "+cm.label+" — Versões"));
  hr.appendChild(ht);hdr.appendChild(hr);w.appendChild(hdr);
  const con=dv({padding:"14px 14px 30px"});
  if(!vers.length){
    const emp=dv({textAlign:"center",padding:"60px 20px",color:"var(--dim)"});
    emp.appendChild(el("div",{fontSize:"40px",marginBottom:"10px"},"📋"));
    emp.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"15px",letterSpacing:"1px"},"Nenhuma versão salva"));
    con.appendChild(emp);
  }else{
    con.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"11px",letterSpacing:"2px",color:"var(--dim)",textTransform:"uppercase",marginBottom:"10px"},`${vers.length}/5 VERSÕES`+(GD.st==="on"?" · ☁️ Backup ativo":"")));
    [...vers].reverse().forEach((ver,ri)=>{
      const idx=vers.length-1-ri,isA=idx===ai;
      const c=dv({background:isA?"rgba(225,6,0,0.05)":"var(--card)",border:`1px solid ${isA?"var(--red)":"var(--border)"}`,borderRadius:"8px",padding:"12px 14px",marginBottom:"8px",position:"relative"});
      if(isA){const vb=el("div",{position:"absolute",top:"10px",right:"10px",background:"var(--red)",color:"white",fontSize:"10px",fontWeight:700,padding:"2px 7px",borderRadius:"2px",letterSpacing:"1px",fontFamily:"'Barlow Condensed',sans-serif"},"ATIVO");c.appendChild(vb);}
      const tr=dv({display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"});
      const sd=dv({});for(let i=0;i<5;i++)sd.appendChild(el("span",{fontSize:"14px"},i<ver.stars?"⭐":"☆"));
      tr.append(sd,el("span",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"12px",color:"var(--dim)",marginLeft:"auto"},fd(ver.ts)));
      c.appendChild(tr);
      if(ver.note)c.appendChild(el("div",{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"13px",color:"rgba(255,255,255,0.55)",marginBottom:"6px",fontStyle:"italic"},`"${ver.note}"`));
      const ms=dv({display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"10px"});
      const s=ver.setup;
      [`Asa ${s.asa_d}/${s.asa_t}`,`Susp ${s.susp_d}/${s.susp_t}`,`H ${s.alt_d}/${s.alt_t}`,`⏱ ${ft(s.tmin,s.tseg,s.tms)}`].forEach(txt=>ms.appendChild(el("span",{fontSize:"11px",color:"var(--dimmer)",fontFamily:"'Barlow Condensed',sans-serif"},txt)));
      c.appendChild(ms);
      const br=dv({display:"flex",gap:"6px"});
      br.appendChild(bt(isA?"✓ Carregado":"Carregar Setup",{flex:1,background:isA?"rgba(27,122,27,0.15)":"rgba(225,6,0,0.12)",color:isA?"#4caf50":"var(--red)",border:`1px solid ${isA?"rgba(76,175,80,0.3)":"rgba(225,6,0,0.3)"}`,borderRadius:"4px",padding:"8px",fontWeight:700,fontSize:"12px",letterSpacing:"1px",textTransform:"uppercase"},()=>{
        if(!DB[S.track.name]?.[S.mode])return;
        DB[S.track.name][S.mode].activeIdx=idx;sDB();
        ss({form:{...ver.setup},screen:"setup"});toast("✓ Setup carregado!");
      }));
      br.appendChild(bt("🗑",{background:"rgba(255,255,255,0.04)",border:"1px solid var(--border)",borderRadius:"4px",padding:"8px 12px",color:"rgba(255,255,255,0.4)",fontSize:"14px"},()=>{if(confirm("Apagar esta versão?")){delVer(S.track.name,S.mode,idx);render();}}));
      c.appendChild(br);con.appendChild(c);
    });
  }
  w.appendChild(con);return w;
}

// ── DOM helpers ──
function el(tag,st={},txt){const e=document.createElement(tag);Object.assign(e.style,st);if(txt!==undefined)e.textContent=txt;return e;}
function dv(st={},...ch){const e=document.createElement("div");Object.assign(e.style,st);ch.flat().forEach(c=>{if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e;}
function bt(lbl,st={},fn){const e=document.createElement("button");Object.assign(e.style,st);e.textContent=lbl;if(fn)e.addEventListener("click",fn);return e;}

// ── Boot ──
// Verifica se já tinha sessão salva
const savedGD = localStorage.getItem("f1gd");
if(savedGD){
  try{
    const t=JSON.parse(savedGD);
    if(t.exp>Date.now()){
      // Sessão válida — vai direto para lista
      S.screen="list";
    }
  }catch{}
}
render();
// Drive inicia em background
GD.init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
